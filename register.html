
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h2 class="text-center mt-5">Student Registration</h2>

   
<div class="container mt-4 mb-5">

    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">

        <h4 class="text-center mb-4">Create Your Account</h4>

        <form id="registerForm">

            <div class="mb-3">
                <label class="form-label">Student Name</label>
                <input type="text" id="studentName" class="form-control"
                    placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Student ID</label>
                <input type="text" id="studentID" class="form-control"
                    placeholder="Enter your Student ID" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control"
                    placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" id="registerPassword" class="form-control"
                    placeholder="Create a password" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="confirmpassword" id="confirmPassword" class="form-control"
                    placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>

            <p id="registerMessage" class="text-center mt-3"></p>

        </form>

        <p class="text-center mt-3">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>

</div>

<script src="javascript/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
