
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Westlake</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Westlake Student Portal
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="login.html">Login</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Login Section -->
    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card shadow p-4">

                    <h2 class="text-center mb-4">
                        Student Login
                    </h2>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label class="form-label">Student ID</label>
                            <input type="text" id="studentID" class="form-control"
                                placeholder="Enter your Student ID">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control"
                                placeholder="Enter your password">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>

                        <p id="errorMessage" class="text-danger text-center mt-3"></p>

                        <!-- Test Login Credentials -->
                        <div class="mt-3 text-center">
    <small class="text-muted">
        <strong>Test Login Credentials</strong>
        <br>
        Student ID: 2026123456
        <br>
        Password: student123
    </small>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

<!-- JavaScript -->
<script src="javascript/script.js"></script>
<!-- Bootstrap 5 JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>


</html>
